<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex CLI</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 id="title">Codex CLI</h1>
          <p id="rateLimit" class="rate-limit">Rate limit: loading...</p>
        </div>
        <div class="actions">
          <button id="uploadAuth" class="icon-button" type="button" aria-label="Upload auth.json" title="Upload auth.json"><i class="fa-solid fa-key" aria-hidden="true"></i></button>
          <button id="pasteImage" class="icon-button" type="button" aria-label="Paste image" title="Paste image"><i class="fa-solid fa-paste" aria-hidden="true"></i></button>
          <button id="reloadYaml" class="icon-button" type="button" aria-label="Reload YAML" title="Reload YAML"><i class="fa-solid fa-rotate" aria-hidden="true"></i></button>
          <button id="restartHa" class="icon-button danger" type="button" aria-label="Restart Home Assistant" title="Restart Home Assistant"><i class="fa-solid fa-power-off" aria-hidden="true"></i></button>
        </div>
      </header>

      <section id="dropZone" class="drop-zone">
        <div id="terminal" class="terminal"></div>
        <div id="dropHint" class="drop-hint">Drop image to attach</div>
      </section>

      <aside id="imagePanel" class="panel hidden">
        <div class="image-summary">
          <img id="imagePreview" class="image-preview" alt="Pasted image preview">
          <div>
          <strong>Pasted image saved</strong>
          <p id="imagePath"></p>
          </div>
        </div>
        <div class="panel-actions">
          <button id="insertPath" type="button">Insert Path</button>
          <button id="closeImagePanel" type="button">Close</button>
        </div>
      </aside>

      <aside id="authPanel" class="panel auth hidden">
        <div>
          <strong>Authentication</strong>
          <p id="authState">Upload an existing Codex auth.json from another machine.</p>
        </div>
        <form id="authUploadForm">
          <label>
            Codex auth.json
            <input id="authFile" name="authFile" type="file" accept="application/json,.json">
          </label>
          <p id="authPath" class="hint"></p>
          <p class="hint">On a logged-in device, this is usually `~/.codex/auth.json`. The add-on stores it at `/data/home/.codex/auth.json`.</p>
          <div class="panel-actions">
            <button id="uploadAuthSubmit" type="submit" class="primary">Upload</button>
            <button id="closeAuthPanel" type="button">Close</button>
          </div>
        </form>
      </aside>

      <div id="toast" class="toast hidden"></div>
      <div id="pasteCatcher" class="paste-catcher" contenteditable="true" aria-hidden="true"></div>
    </main>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="app.js"></script>
  </body>
</html>
