<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex CLI</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Codex CLI</h1>
          <p id="meta">Connecting...</p>
        </div>
        <div class="actions">
          <button id="uploadAuth" type="button">Upload auth.json</button>
          <button id="loginDevice" type="button">Device Login</button>
          <button id="loginStatus" type="button">Login Status</button>
        </div>
      </header>

      <section id="dropZone" class="drop-zone">
        <div id="terminal" class="terminal"></div>
        <div id="dropHint" class="drop-hint">Drop image to attach</div>
      </section>

      <aside id="imagePanel" class="panel hidden">
        <div>
          <strong>Pasted image saved</strong>
          <p id="imagePath"></p>
        </div>
        <label>
          Prompt for Codex
          <textarea id="imagePrompt" rows="3" placeholder="Ask Codex about the pasted image..."></textarea>
        </label>
        <div class="panel-actions">
          <button id="insertPath" type="button">Insert Path</button>
          <button id="runImage" type="button" class="primary">Run with Image</button>
          <button id="closeImagePanel" type="button">Close</button>
        </div>
      </aside>

      <aside id="authPanel" class="panel auth hidden">
        <div>
          <strong>Authentication</strong>
          <p id="authState">Upload an existing Codex auth.json from another machine.</p>
        </div>
        <form id="authUploadForm">
          <label>
            Codex auth.json
            <input id="authFile" name="authFile" type="file" accept="application/json,.json">
          </label>
          <p id="authPath" class="hint"></p>
          <p class="hint">On a logged-in device, this is usually `~/.codex/auth.json`. The add-on stores it at `/data/home/.codex/auth.json`.</p>
          <div class="panel-actions">
            <button id="uploadAuthSubmit" type="submit" class="primary">Upload</button>
            <button id="closeAuthPanel" type="button">Close</button>
          </div>
        </form>
      </aside>

      <div id="toast" class="toast hidden"></div>
    </main>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="app.js"></script>
  </body>
</html>
